[project]
name = "grok-agent"
version = "0.1.0"
description = "LiveKit Agent for Grok Playground"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "livekit>=0.19.0",
    "livekit-agents>=1.3.7",
    "livekit-plugins-openai>=1.3.7",
    "livekit-plugins-xai",
    "python-dotenv",
    "xai-sdk>=1.0.0",
    "Pillow>=12.0.0",
    "packaging>=21.0",
]

[tool.uv.sources]
livekit-plugins-xai = { git = "https://github.com/livekit/agents", subdirectory = "livekit-plugins/livekit-plugins-xai", branch = "main" }
